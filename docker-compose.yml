# docker-compose.yml — full stack with AI API keys
# Usage: docker compose up --build
# Requires: GEMINI_API_KEY or OPENAI_API_KEY in .env  (or set AI_MODE=local to skip)
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: autoapply-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      FRONTEND_URL: "http://localhost:3000"
      LOG_LEVEL: info
      DATA_DIR: /app/data
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    container_name: autoapply-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  backend-data:
  backend-uploads:
  backend-logs:
